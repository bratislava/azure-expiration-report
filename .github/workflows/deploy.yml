name: Deploy

# The report runs only on the production cluster.
on:
  push:
    tags:
      - "prod**"

permissions:
  contents: read

jobs:
  build:
    name: Build
    uses: ./.github/workflows/_build.yml
    secrets: inherit
    with:
      cluster: production

  trigger-deploy:
    name: Trigger Infrastructure Deploy (production)
    needs: build
    uses: bratislava/github-actions/.github/workflows/trigger-infra-deploy.yml@7a3c849b65c1edbea5c3a95fd29952ae1f3e1412 # v3.0.1
    secrets: inherit
    with:
      cluster: production
      app: azure-expiration-report
